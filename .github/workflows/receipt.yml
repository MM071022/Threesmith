name: Threesmith receipt (self test)

on:
  pull_request:

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Review the demo with the local build
        run: node dist/cli.js ci examples/demo --check examples/demo --root . --baseline demo --fail-on error --min-score 90
