name: Bug
description: Something in Threesmith does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx threesmith doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or MCP tool call, and a small project if you can share one.
